name: Devnet rgb installed CachyOS original ZIP testmode lifecycle QA v0.1.0
on:
  push:
    branches: [qa/native-installed-testmode-v0.1.0]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  installed-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_TAG: qa-package-v8.11
      PACKAGE_ZIP: devnet-rgb-control-v8.11.zip
      PACKAGE_SHA256: aac1ecc08f1d905959e390396b754be1999345e5076aeebf0d9b5dc8fe4fbdb0
      APP_ID: rgb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare exact candidate and original tested installed-system VM scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 qemu-utils mtools dosfstools
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p /tmp/devnet-qa evidence
          base=https://iso.cachyos.org/desktop/260809
          iso=cachyos-desktop-linux-260809.iso
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 "$base/$iso.sha256" -o "/tmp/devnet-qa/$iso.sha256"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 "$base/$iso" -o "/tmp/devnet-qa/$iso"
          (cd /tmp/devnet-qa && sha256sum -c "$iso.sha256") | tee evidence/iso-sha256.txt
          gh release download "$PACKAGE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PACKAGE_ZIP" --dir /tmp/devnet-qa
          printf '%s  %s\n' "$PACKAGE_SHA256" "/tmp/devnet-qa/$PACKAGE_ZIP" | sha256sum -c - | tee evidence/app-sha256.txt
          baseold=https://raw.githubusercontent.com/devnet82/devnet-cachyos-repair/1f6e23bc170009f15a90941b2fb81c9e280b59f2/qa/installed-v0.1.19
          basenew=https://raw.githubusercontent.com/devnet82/devnet-cachyos-repair/1b6a8b2271f3b9a5806e3cc4ab67746f4952a0e1/qa/testmode-installed-v0.1.0
          curl -fLsS "$baseold/install-guest.sh" -o /tmp/devnet-qa/install-guest.sh
          curl -fLsS "$baseold/qemu_control.py" -o /tmp/devnet-qa/qemu_control.py
          curl -fLsS "$basenew/installed-boot-testmode-qa.sh" -o /tmp/devnet-qa/installed-boot-qa.sh
          curl -fLsS "$basenew/guest_installed_testmode.py" -o /tmp/devnet-qa/guest_installed_testmode.py
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/devnet-qa/installed-boot-qa.sh')
          s=p.read_text().replace('SHA_TOKEN',os.environ['PACKAGE_SHA256']).replace('APP_TOKEN',os.environ['APP_ID'])
          assert 'SHA_TOKEN' not in s and 'APP_TOKEN' not in s
          p.write_text(s)
          PY
          bash -n /tmp/devnet-qa/install-guest.sh /tmp/devnet-qa/installed-boot-qa.sh
          python3 -m py_compile /tmp/devnet-qa/qemu_control.py /tmp/devnet-qa/guest_installed_testmode.py
      - name: Allocate guarded disposable disk and inject candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          qemu-img create -f qcow2 /tmp/devnet-qa/only-qa-system.qcow2 12G
          truncate -s 128M /tmp/devnet-qa/only-qa-control.img
          mkfs.vfat -F 32 -n DEVNETQA /tmp/devnet-qa/only-qa-control.img
          image=/tmp/devnet-qa/only-qa-control.img
          for n in install-guest.sh installed-boot-qa.sh guest_installed_testmode.py; do
            mcopy -i "$image" "/tmp/devnet-qa/$n" "::/$n"
          done
          mcopy -i "$image" "/tmp/devnet-qa/$PACKAGE_ZIP" ::/candidate.zip
          mdir -i "$image" ::/ | tee evidence/control-disk-list.txt
      - name: Install actual CachyOS BTRFS GRUB disk using previously verified workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          qemu-system-x86_64 -machine q35,accel=kvm -cpu host -m 6144 -smp 4 \
            -drive file=/tmp/devnet-qa/cachyos-desktop-linux-260809.iso,media=cdrom,if=ide \
            -drive if=none,id=control,file=/tmp/devnet-qa/only-qa-control.img,format=raw \
            -device virtio-blk-pci,drive=control,serial=DEVNETCONTROL \
            -drive if=none,id=system,file=/tmp/devnet-qa/only-qa-system.qcow2,format=qcow2 \
            -device virtio-blk-pci,drive=system,serial=DEVNETQAONLY,bootindex=1 \
            -netdev user,id=qa-net -device virtio-net-pci,netdev=qa-net \
            -boot order=d -vga std -display none -serial file:evidence/live-serial.log \
            -monitor unix:/tmp/devnet-qa-live.sock,server=on,wait=off \
            -daemonize -pidfile /tmp/devnet-qa-live.pid
          sleep 125
          python3 /tmp/devnet-qa/qemu_control.py /tmp/devnet-qa-live.sock begin-install
          image=/tmp/devnet-qa/only-qa-control.img
          for attempt in $(seq 1 150); do
            mcopy -o -i "$image" ::/install.log evidence/install.log >/dev/null 2>&1 || true
            if mcopy -o -i "$image" ::/install-ready.txt evidence/install-ready.txt >/dev/null 2>&1; then
              echo INSTALLED_IMAGE_PREPARATION_REPORTED
              break
            fi
            if grep -q '^INSTALL_SCRIPT_EXIT=[1-9]' evidence/install.log 2>/dev/null; then
              echo INSTALL_SCRIPT_FAILED_EARLY
              break
            fi
            sleep 7
          done
          mcopy -o -i "$image" ::/install.log evidence/install.log || true
          mcopy -o -i "$image" ::/install-ready.txt evidence/install-ready.txt || true
          mcopy -o -i "$image" ::/target-btrfs-uuid.txt evidence/target-btrfs-uuid.txt || true
          grep -F INSTALLED_BTRFS_GRUB_PREPARED evidence/install-ready.txt
          grep -F INSTALL_SCRIPT_EXIT=0 evidence/install.log
      - name: Test app install uninstall and snapshot rollback in offline installed VM
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -s /tmp/devnet-qa-live.pid; then kill "$(cat /tmp/devnet-qa-live.pid)" || true; fi
          sleep 4
          qemu-system-x86_64 -machine q35,accel=kvm -cpu host -m 4096 -smp 4 \
            -drive if=none,id=control,file=/tmp/devnet-qa/only-qa-control.img,format=raw \
            -device virtio-blk-pci,drive=control,serial=DEVNETCONTROL \
            -drive if=none,id=system,file=/tmp/devnet-qa/only-qa-system.qcow2,format=qcow2 \
            -device virtio-blk-pci,drive=system,serial=DEVNETQAONLY,bootindex=1 \
            -nic none -boot order=c -vga std -display none -serial file:evidence/installed-serial.log \
            -monitor unix:/tmp/devnet-qa-installed.sock,server=on,wait=off \
            -daemonize -pidfile /tmp/devnet-qa-installed.pid
          image=/tmp/devnet-qa/only-qa-control.img
          for attempt in $(seq 1 80); do
            for n in installed-boot.log installed-first-pass.txt testmode-result.json app-snapshot-rollback.txt restore-grub-prepared.txt installed-restored-pass.txt; do
              mcopy -o -i "$image" "::/$n" "evidence/$n" >/dev/null 2>&1 || true
            done
            if grep -q INSTALLED_GRUB_BTRFS_REBOOT_ROLLBACK_PASS evidence/installed-restored-pass.txt 2>/dev/null; then
              echo INSTALLED_APP_SNAPSHOT_ROLLBACK_REBOOT_VERIFIED
              break
            fi
            sleep 8
          done
          grep -F INSTALLED_GRUB_BTRFS_FIRST_BOOT_PASS evidence/installed-first-pass.txt
          grep -F INSTALLED_GRUB_BTRFS_REBOOT_ROLLBACK_PASS evidence/installed-restored-pass.txt
          grep -F APP_FIXTURE_BTRFS_ROLLBACK_PASS evidence/app-snapshot-rollback.txt
          test -s evidence/testmode-result.json
      - name: Preserve all evidence even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-installed-testmode-rgb-v0.1.0
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Gate genuine installed-system original ZIP testmode regression without hardware claims
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("evidence/testmode-result.json")
          assert p.is_file(),"FAIL: native installed guest test report missing"
          d=json.loads(p.read_text())
          assert d["schema"]=="devnet-installed-cachyos-original-testmode-v0.1.0"
          assert d["app"]==os.environ["APP_ID"]
          assert d["release_approval"]=="BLOCKED"
          assert d["full_production_install"]=="NOT_TESTED"
          assert d["real_device_or_steam_runtime"]=="NOT_TESTED"
          required={
            "rgb":("installed_native_cachyos_btrfs","original_candidate_checksum","testmode_install","configuration_migration_fixture","repeat_install","testmode_uninstall_preserve_config"),
            "chatbox":("installed_native_cachyos_btrfs","original_candidate_checksum","testmode_install","repeat_install","interrupted_install_rollback","testmode_uninstall_preserve_config"),
            "wrapper":("installed_native_cachyos_btrfs","original_candidate_checksum","fixture_install","repeat_fixture_install","fixture_uninstall_restore_original","missing_dependency_preflight")
          }
          for item in required[d["app"]]:
            assert d["checks"].get(item)=="PASS",(item,d)
          assert "APP_FIXTURE_BTRFS_ROLLBACK_PASS" in Path("evidence/app-snapshot-rollback.txt").read_text()
          assert "INSTALLED_GRUB_BTRFS_REBOOT_ROLLBACK_PASS" in Path("evidence/installed-restored-pass.txt").read_text()
          print("NATIVE_CACHYOS_INSTALLED_TESTMODE_LIFECYCLE_PASS",d["app"])
          print("PRODUCTION_DEPS_GUI_HARDWARE_ACCEPTANCE_NOT_TESTED; MASTER_QA_BLOCKED")
          PY
