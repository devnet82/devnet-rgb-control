name: Devnet RGB v8.8 package QA

on:
  push:
    branches:
      - main
      - release-v8.8
  pull_request:
  workflow_dispatch:

jobs:
  package-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version | head -n1
          python3 --version

      - name: Run standalone package QA
        run: bash tests/test-package.sh

      - name: Build release archive
        run: |
          git archive --format=zip --prefix=devnet-rgb-control-v8.8/ HEAD -o devnet-rgb-control-v8.8.zip
          sha256sum devnet-rgb-control-v8.8.zip > devnet-rgb-control-v8.8.zip.sha256

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: devnet-rgb-control-v8.8
          path: |
            devnet-rgb-control-v8.8.zip
            devnet-rgb-control-v8.8.zip.sha256
          if-no-files-found: error
